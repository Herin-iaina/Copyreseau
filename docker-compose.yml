version: '3.8'

services:
  macos-installer:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./data/files:/data/files
      - ./data/system_info:/data/system_info
      - ./data/templates:/data/templates
      - ./data/apps:/data/apps
      - ./data/macos_installer.log:/data/macos_installer.log
      - ./data/system_info.db:/data/system_info.db
      - ./data/scan_results.csv:/data/scan_results.csv
    restart: unless-stopped
    networks:
      - host
      - bridge

networks:
  host:
    external: true
  bridge:
    driver: bridge 