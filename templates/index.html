<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance des Systèmes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            margin-bottom: 1.5rem;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .battery-low {
            color: #dc3545;
        }
        .battery-medium {
            color: #ffc107;
        }
        .battery-high {
            color: #198754;
        }
        .disk-warning {
            color: #dc3545;
        }

        /* Nouveaux styles pour le modal */
        .system-details {
            font-size: 0.9rem;
        }
        .system-details .section {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #f8f9fa;
        }
        .system-details .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #0d6efd;
        }
        .system-details .info-item {
            display: flex;
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }
        .system-details .info-label {
            font-weight: 500;
            min-width: 150px;
            color: #495057;
        }
        .system-details .info-value {
            flex: 1;
        }
        .system-details .apps-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .system-details .app-badge {
            background-color: #e9ecef;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">
                    <i class="fas fa-desktop me-2"></i>
                    Surveillance des Systèmes
                </h4>
                <div>
                    <a href="/export/csv" class="btn btn-light me-2">
                        <i class="fas fa-file-csv me-1"></i> Export CSV
                    </a>
                    <a href="/export/xlsx" class="btn btn-light">
                        <i class="fas fa-file-excel me-1"></i> Export Excel
                    </a>
                </div>
            </div>
            <div class="card-body">
                <table id="systemsTable" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Hostname</th>
                            <th>IP</th>
                            <th>Dernière Mise à Jour</th>
                            <th>Batterie</th>
                            <th>Utilisateur</th>
                            <th>Démarrage</th>
                            <th>Disque</th>
                            <th>Applications</th>
                            <th>Mémoire</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails du système -->
    <div class="modal fade" id="systemDetailsModal" tabindex="-1" aria-labelledby="systemDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="systemDetailsModalLabel">Détails du Système</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="systemDetails" class="system-details">
                        <!-- Les données seront insérées ici dynamiquement -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    
    <script>
        $(document).ready(function() {
            $('#systemsTable').DataTable({
                ajax: '/api/systems',
                columns: [
                    { 
                        data: 'hostname',
                        render: function(data) {
                            if (!data) return '';
                            return data.split('.')[0];
                        }
                    },
                    { data: 'ip' },
                    { 
                        data: 'last_update',
                        render: function(data) {
                            return new Date(data).toLocaleString();
                        }
                    },
                    { 
                        data: 'battery',
                        render: function(data) {
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            let colorClass = 'battery-high';
                            if (percent < 20) colorClass = 'battery-low';
                            else if (percent < 50) colorClass = 'battery-medium';
                            
                            let extraInfo = '';
                            if (data.max_capacity_percent && data.max_capacity_percent !== 'null') {
                                extraInfo += `<div class='small text-muted'>Capacité max: ${data.max_capacity_percent}%</div>`;
                            }
                            if (data.condition && data.condition !== 'null') {
                                extraInfo += `<div class='small text-muted'>État: ${data.condition}</div>`;
                            }
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-battery-${Math.ceil(percent/25)} me-1"></i>
                                ${percent}% ${data.power_plugged === 'true' ? '<i class="fas fa-plug"></i>' : ''}
                                ${data.time_left ? `(${data.time_left})` : ''}
                                ${extraInfo}
                            </div>`;
                        }
                    },
                    { data: 'current_user' },
                    { 
                        data: 'boot_time',
                        render: function(data) {
                            return new Date(data).toLocaleString();
                        }
                    },
                    { 
                        data: 'disk',
                        render: function(data) {
                            // console.log(data);
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            const colorClass = percent > 90 ? 'disk-warning' : '';
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-hdd me-1"></i>
                                ${data.free}GB / ${data.total}GB libres (${percent}%)
                            </div>`;
                        }
                    },
                    {
                        data: 'running_apps',
                        render: function(data) {
                            // console.log(data);
                            if (!data) return 'N/A';
                            const apps = Object.keys(data).filter(app => data[app]);
                            return `<div class="small">
                                <i class="fas fa-window-maximize me-1"></i>
                                ${apps.length} applications
                                <div class="text-muted">${apps.slice(0, 3).join(', ')}${apps.length > 3 ? '...' : ''}</div>
                            </div>`;
                        }
                    },
                    {
                        data: 'memory',
                        render: function(data) {
                            console.log(data);
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            let colorClass = '';
                            if (percent > 90) colorClass = 'disk-warning';
                            else if (percent > 70) colorClass = 'battery-medium';
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-memory me-1"></i>
                                ${data.used.toFixed(1)}GB / ${data.total}GB (${percent}%)
                            </div>`;
                        }
                    }
                ],
                order: [[2, 'desc']],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/fr-FR.json'
                },
                pageLength: 25,
                autoWidth: false,
                responsive: true,
                rowCallback: function(row, data) {
                    $(row).css('cursor', 'pointer');
                }
            });

            // Gestionnaire de clic sur une ligne
            $('#systemsTable tbody').on('click', 'tr', function() {
                const data = $('#systemsTable').DataTable().row(this).data();
                const modal = new bootstrap.Modal(document.getElementById('systemDetailsModal'));
                
                // Créer le contenu HTML structuré
                const content = `
                    <div class="section">
                        <div class="section-title">Informations Générales</div>
                        <div class="info-item">
                            <span class="info-label">Hostname:</span>
                            <span class="info-value">${data.hostname}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Adresse IP:</span>
                            <span class="info-value">${data.ip}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Dernière mise à jour:</span>
                            <span class="info-value">${new Date(data.last_update).toLocaleString()}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Utilisateur actuel:</span>
                            <span class="info-value">${data.current_user}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Ressources Système</div>
                        <div class="info-item">
                            <span class="info-label">CPU:</span>
                            <span class="info-value">${data.cpu ? `${data.cpu.percent}% (${data.cpu.count} cœurs)` : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Mémoire:</span>
                            <span class="info-value">${data.memory ? `${data.memory.used.toFixed(1)}GB / ${data.memory.total}GB (${data.memory.percent}%)` : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Disque:</span>
                            <span class="info-value">${data.disk ? `${data.disk.free}GB / ${data.disk.total}GB libres (${data.disk.percent}%)` : 'N/A'}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Batterie</div>
                        <div class="info-item">
                            <span class="info-label">Niveau:</span>
                            <span class="info-value">${data.battery ? `${data.battery.percent}%` : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">État:</span>
                            <span class="info-value">${data.battery ? (data.battery.power_plugged === 'true' ? 'Branché' : 'Sur batterie') : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Temps restant:</span>
                            <span class="info-value">${data.battery && data.battery.time_left ? data.battery.time_left : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Capacité maximale:</span>
                            <span class="info-value">${data.battery && data.battery.max_capacity_percent ? `${data.battery.max_capacity_percent}%` : 'N/A'}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Applications en cours</div>
                        <div class="apps-list">
                            ${data.running_apps ? Object.entries(data.running_apps)
                                .filter(([_, isRunning]) => isRunning)
                                .map(([app]) => `<span class="app-badge">${app}</span>`)
                                .join('') : 'Aucune application en cours'}
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">Réseau</div>
                        <div class="info-item">
                            <span class="info-label">Données envoyées:</span>
                            <span class="info-value">${data.network ? `${(data.network.bytes_sent / 1024 / 1024).toFixed(2)} MB` : 'N/A'}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Données reçues:</span>
                            <span class="info-value">${data.network ? `${(data.network.bytes_recv / 1024 / 1024).toFixed(2)} MB` : 'N/A'}</span>
                        </div>
                    </div>
                `;
                
                document.getElementById('systemDetails').innerHTML = content;
                modal.show();
            });
        });
    </script>
</body>
</html>
