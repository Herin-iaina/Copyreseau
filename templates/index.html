<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Installer Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>macOS Installer Server</h1>
        <div id="systems-table">
            <table>
                <thead>
                    <tr>
                        <th>Hostname</th>
                        <th>IP Address</th>
                        <th>Last Update</th>
                        <th>Battery</th>
                        <th>Current User</th>
                        <th>Disk Usage</th>
                    </tr>
                </thead>
                <tbody id="systems-data">
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadSystemsData() {
            fetch('/api/systems')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('systems-data');
                    tbody.innerHTML = '';
                    
                    data.data.forEach(system => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${system.hostname}</td>
                            <td>${system.ip}</td>
                            <td>${system.last_update}</td>
                            <td>${system.battery ? system.battery + '%' : 'N/A'}</td>
                            <td>${system.current_user || 'N/A'}</td>
                            <td>${system.disk ? system.disk + '%' : 'N/A'}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error loading systems data:', error));
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadSystemsData);

        // Refresh data every 30 seconds
        setInterval(loadSystemsData, 30000);
    </script>
</body>
</html>
