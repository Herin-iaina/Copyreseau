<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surveillance des Systèmes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .card {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            margin-bottom: 1.5rem;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .battery-low {
            color: #dc3545;
        }
        .battery-medium {
            color: #ffc107;
        }
        .battery-high {
            color: #198754;
        }
        .disk-warning {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">
                    <i class="fas fa-desktop me-2"></i>
                    Surveillance des Systèmes
                </h4>
                <div>
                    <a href="/export/csv" class="btn btn-light me-2">
                        <i class="fas fa-file-csv me-1"></i> Export CSV
                    </a>
                    <a href="/export/xlsx" class="btn btn-light">
                        <i class="fas fa-file-excel me-1"></i> Export Excel
                    </a>
                </div>
            </div>
            <div class="card-body">
                <table id="systemsTable" class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Hostname</th>
                            <th>IP</th>
                            <th>Dernière Mise à Jour</th>
                            <th>Batterie</th>
                            <th>Utilisateur</th>
                            <th>Démarrage</th>
                            <th>Disque</th>
                            <th>Applications</th>
                            <th>Mémoire</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails du système -->
    <div class="modal fade" id="systemDetailsModal" tabindex="-1" aria-labelledby="systemDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="systemDetailsModalLabel">Détails du Système</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="systemDetails" class="bg-light p-3 rounded"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    
    <script>
        $(document).ready(function() {
            $('#systemsTable').DataTable({
                ajax: '/api/systems',
                columns: [
                    { 
                        data: 'hostname',
                        render: function(data) {
                            if (!data) return '';
                            return data.split('.')[0];
                        }
                    },
                    { data: 'ip' },
                    { 
                        data: 'last_update',
                        render: function(data) {
                            return new Date(data).toLocaleString();
                        }
                    },
                    { 
                        data: 'battery',
                        render: function(data) {
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            let colorClass = 'battery-high';
                            if (percent < 20) colorClass = 'battery-low';
                            else if (percent < 50) colorClass = 'battery-medium';
                            
                            let extraInfo = '';
                            if (data.max_capacity_percent && data.max_capacity_percent !== 'null') {
                                extraInfo += `<div class='small text-muted'>Capacité max: ${data.max_capacity_percent}%</div>`;
                            }
                            if (data.condition && data.condition !== 'null') {
                                extraInfo += `<div class='small text-muted'>État: ${data.condition}</div>`;
                            }
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-battery-${Math.ceil(percent/25)} me-1"></i>
                                ${percent}% ${data.power_plugged === 'true' ? '<i class="fas fa-plug"></i>' : ''}
                                ${data.time_left ? `(${data.time_left})` : ''}
                                ${extraInfo}
                            </div>`;
                        }
                    },
                    { data: 'current_user' },
                    { 
                        data: 'boot_time',
                        render: function(data) {
                            return new Date(data).toLocaleString();
                        }
                    },
                    { 
                        data: 'disk',
                        render: function(data) {
                            // console.log(data);
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            const colorClass = percent > 90 ? 'disk-warning' : '';
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-hdd me-1"></i>
                                ${data.free}GB / ${data.total}GB libres (${percent}%)
                            </div>`;
                        }
                    },
                    {
                        data: 'running_apps',
                        render: function(data) {
                            // console.log(data);
                            if (!data) return 'N/A';
                            const apps = Object.keys(data).filter(app => data[app]);
                            return `<div class="small">
                                <i class="fas fa-window-maximize me-1"></i>
                                ${apps.length} applications
                                <div class="text-muted">${apps.slice(0, 3).join(', ')}${apps.length > 3 ? '...' : ''}</div>
                            </div>`;
                        }
                    },
                    {
                        data: 'memory',
                        render: function(data) {
                            console.log(data);
                            if (!data) return 'N/A';
                            const percent = data.percent;
                            let colorClass = '';
                            if (percent > 90) colorClass = 'disk-warning';
                            else if (percent > 70) colorClass = 'battery-medium';
                            
                            return `<div class="${colorClass}">
                                <i class="fas fa-memory me-1"></i>
                                ${data.used.toFixed(1)}GB / ${data.total}GB (${percent}%)
                            </div>`;
                        }
                    }
                ],
                order: [[2, 'desc']],
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/fr-FR.json'
                },
                pageLength: 25,
                autoWidth: false,
                responsive: true,
                rowCallback: function(row, data) {
                    $(row).css('cursor', 'pointer');
                }
            });

            // Gestionnaire de clic sur une ligne
            $('#systemsTable tbody').on('click', 'tr', function() {
                const data = $('#systemsTable').DataTable().row(this).data();
                // Récupérer les données complètes depuis l'API
                $.get('/api/systems', function(allData) {
                    const systemData = allData.find(system => system.hostname === data.hostname);
                    const modal = new bootstrap.Modal(document.getElementById('systemDetailsModal'));
                    document.getElementById('systemDetails').textContent = JSON.stringify(systemData, null, 2);
                    modal.show();
                });
            });
        });
    </script>
</body>
</html>
