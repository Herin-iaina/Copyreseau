<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paramètres - Réinitialisation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f7f7f7; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px #0001; max-width: 500px; margin: auto; }
        h1 { color: #333; }
        button { background: #d32f2f; color: #fff; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #b71c1c; }
        .message { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Paramètres</h1>
        <p>Vous pouvez réinitialiser toutes les données du serveur (infos systèmes, logs, etc.).</p>
        <button id="resetBtn">Réinitialiser les données</button>
        <div class="message" id="message"></div>
        <br>
        <a href="/">&#8592; Retour à l'accueil</a>
    </div>
    <script>
        document.getElementById('resetBtn').onclick = function() {
            if(confirm('Êtes-vous sûr de vouloir réinitialiser toutes les données ? Cette action est irréversible.')) {
                fetch('/reset_data', {method: 'POST'})
                    .then(response => response.json())
                    .then(data => {
                        let msg = data.message || data.error;
                        if (data.error && data.details) {
                            msg += ' (' + data.details + ')';
                        }
                        document.getElementById('message').textContent = msg;
                        document.getElementById('message').style.color = data.error ? 'red' : 'green';
                    })
                    .catch(() => {
                        document.getElementById('message').textContent = 'Erreur lors de la réinitialisation.';
                        document.getElementById('message').style.color = 'red';
                    });
            }
        };
    </script>
</body>
</html>
